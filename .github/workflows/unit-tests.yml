name: Unit Tests

# Runs the Focus Bear logic unit tests (AppBlockingHelper / URLBlockingHelper /
# urlValidation). These are pure-logic tests hosted in the app target; they do
# NOT need the Developer-ID signing certs (we build Debug + ad-hoc) and they do
# NOT include the XCUITest UI suite (which needs a real, permissioned desktop).

on:
  pull_request:
    paths:
      - 'FocusBear/**'
      - 'FocusBearTests/**'
      - 'FocusBear.xcodeproj/**'
      - 'FocusBear.xcworkspace/**'
      - 'Podfile'
      - 'Podfile.lock'
      - 'scripts/fetch-sparkle.sh'
      - '.github/workflows/unit-tests.yml'
  push:
    branches:
      - main-human-verified
  workflow_dispatch:

concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Logic unit tests (macOS)
    # Runs on the self-hosted Apple Silicon runner (jeznag's Mac) instead of a
    # paid GitHub-hosted macOS image — these are pure-logic tests, so no signing
    # certs or permissioned desktop are needed. macOS-hosted minutes bill at 10x
    # Linux; this job was ~2,400 min/month (~$145), now ~$0. To fall back to the
    # cloud, set runs-on back to macos-15.
    runs-on: [self-hosted, macOS, ARM64, focusbear-mac-local]
    permissions:
      contents: read
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        # GitHub-hosted images keep versioned Xcodes at /Applications/Xcode_*.app;
        # the self-hosted runner already has the default /Applications/Xcode.app
        # selected, so only switch when a versioned bundle is actually present.
        run: |
          APP=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$APP" ]; then sudo xcode-select -s "$APP" || true; fi

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # Sparkle.framework is not committed to the repo; fetch the pinned,
      # checksum-verified build the project links/embeds.
      - name: Fetch Sparkle.framework
        run: ./scripts/fetch-sparkle.sh

      - name: Run logic unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace FocusBear.xcworkspace \
            -scheme "Focus Bear" \
            -configuration Debug \
            -destination 'platform=macOS' \
            -resultBundlePath TestResults.xcresult \
            -only-testing:"Focus BearTests/AppBlockingTests" \
            -only-testing:"Focus BearTests/URLBlockingTests" \
            -only-testing:"Focus BearTests/validationTest" \
            -only-testing:"Focus BearTests/ScheduleKitTests" \
            -only-testing:"Focus BearTests/FocusMusicMediaKeyTests" \
            -only-testing:"Focus BearTests/DaysOfWeekTests" \
            -only-testing:"Focus BearTests/CustomBlockingScheduleTests" \
            -only-testing:"Focus BearTests/DayPlanRoutineDraftTests" \
            -only-testing:"Focus BearTests/QuickAddTaskParserTests" \
            -only-testing:"Focus BearTests/ToDoLogicTests" \
            -only-testing:"Focus BearTests/SmartSnoozeTests" \
            -only-testing:"Focus BearTests/EventCalendarPickerTests" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            | tee xcodebuild.log

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults.xcresult
            xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
