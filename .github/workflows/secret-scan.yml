name: Secret Scan

# Fails a PR that ADDS an API key or private key. An OpenAI key was hardcoded in AllApi.swift and
# shipped in the binary for four months (#2732). Anything in the app can be read back with `strings`,
# so keys live in the backend's secret store only.
#
# Diff-scoped: only lines the PR adds are checked, so history needs no baseline. Findings never
# print the matched value. The same rule also runs as a unit test (SourceSecretsTests) over the
# whole app source tree.

on:
  pull_request:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: No secrets in added lines
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (full history for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check newly-added lines
        run: |
          set -o pipefail
          BASE="origin/${{ github.event.pull_request.base.ref }}"
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.ref }}"
          git diff "$BASE"...HEAD | python3 scripts/check-added-secrets.py
