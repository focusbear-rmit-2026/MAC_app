<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 id="focusTitle"></h1>
      <p id="focusNotice"></p>
    </div>

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js"
      integrity="sha512-qTXRIMyZIFb8iQcfjXWCO8+M5Tbc38Qi5WzdPOYZHIlZpzBHG3L3by84BBBOiRGiEb7KKtAOAs5qYdUiZiQNNQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>

    <script type="text/javascript">
      const loc = window.location;
      const urlParams = new URLSearchParams(loc.search);
      const originalUrl = loc.href;

      const focusMode = urlParams.get("focus_mode");
      const focusEndTime = urlParams.get("focus_mode_end_time");

      document.getElementById("focusTitle").innerText =
        "Let's keep the focus on " + focusMode;
      const endTime = moment(focusEndTime, "YYYY-MM-DDThh:mm:ssTZD");
      setInterval(
        () => {
          const now = moment();
          if (endTime.diff(now, "minutes") !== 0) {
            document.getElementById("focusNotice").innerText =
              "Your focus block will end " +
              moment.duration(now.diff(endTime)).humanize(true);
          } else {
            clearInterval(null);
            document.getElementById("focusTitle").innerText =
              "Focus block is over!";
            document.getElementById("focusNotice").innerHTML =
              "<a href='" +
              originalUrl +
              "'>Click here to re-open the original URL " +
              originalUrl +
              "</a>";
          }
        },
        1000,
        endTime
      );
    </script>
  </body>
</html>
